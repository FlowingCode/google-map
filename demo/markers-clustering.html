<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width, minimum-scale=1.0, initial-scale=1.0, user-scalable=yes">
  <title>Google Map markers clustering demo</title>
  <script src="../node_modules/@webcomponents/webcomponentsjs/webcomponents-loader.js"></script>
  <style>
    body {
      margin: 0;
      height: 100vh;
    }
    google-map {
      height: 100%;
    }
  </style>
</head>
<body class="fullbleed">

<script type="module">
import '../google-map.js';
import '../google-map-marker.js';

// The map is built in script to generate many markers.
// Markers are added before the map is attached, so they are picked up when the map is initialized.
const params = new URLSearchParams(location.search);
const map = document.createElement('google-map');
map.apiKey = params.get('api-key');
// Optional: ?map-id=... to use a Map ID (cluster icons are then advanced markers)
if (params.get('map-id')) {
  map.mapId = params.get('map-id');
}
map.latitude = 37.75;
map.longitude = -122.35;
map.zoom = 10;
map.enableMarkersClustering = true;
// Optional: ?custom-renderer=1 to use a custom renderer (green clusters)
if (params.get('custom-renderer')) {
  window.customRenderer = {
    render: ({ count, position }) => new google.maps.Marker({
      position,
      label: { text: String(count), color: 'white' },
      icon: { path: google.maps.SymbolPath.CIRCLE, scale: 18, fillColor: 'green', fillOpacity: 1, strokeWeight: 0 },
    }),
  };
  map.customRenderer = 'window.customRenderer';
}

for (let i = 0; i < 100; i++) {
  const marker = document.createElement('google-map-marker');
  marker.slot = 'markers';
  // Deterministic spread around San Francisco
  marker.latitude = 37.70 + ((i * 37) % 100) / 1000;
  marker.longitude = -122.50 + ((i * 53) % 100) / 500;
  marker.title = `Marker ${i}`;
  map.appendChild(marker);
}

document.body.appendChild(map);
</script>
</body>
</html>
